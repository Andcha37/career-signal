name: Refresh public news index and deploy

on:
  push:
    paths:
      - 'scripts/refresh.py'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 4,16 * * *'

# Refreshing data using GITHUB_TOKEN will not itself trigger a new "push" workflow.
# Deploy explicitly after committing the refreshed index so Pages does not serve a stale snapshot.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public headline metadata
        run: python scripts/refresh.py
      - name: Validate index before release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('data/news.json').read_text(encoding='utf-8'))
          assert isinstance(d.get('articles'), list), 'Missing articles array'
          assert all(a.get('title') and a.get('url') and a.get('published_at') for a in d['articles']), 'Malformed article'
          print(f"News index validated: {len(d['articles'])} articles")
          PY
      - name: Commit refreshed public news
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public career headlines'
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy freshly collected news to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
